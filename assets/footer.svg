<svg width="1200" height="150" viewBox="0 0 1200 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&amp;family=Nunito:wght@500;700&amp;display=swap');
      .display { font-family: 'Baloo 2', cursive; }
      .body { font-family: 'Nunito', sans-serif; }
    </style>
    <linearGradient id="duskSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF8FA3"/>
      <stop offset="55%" stop-color="#FFC98B"/>
      <stop offset="100%" stop-color="#FFE29A"/>
    </linearGradient>
    <radialGradient id="footSun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD166"/>
      <stop offset="100%" stop-color="#FF9A3C"/>
    </radialGradient>
    <clipPath id="horizon">
      <rect x="0" y="0" width="1200" height="96"/>
    </clipPath>
  </defs>

  <rect width="1200" height="150" fill="url(#duskSky)"/>

  <g clip-path="url(#horizon)">
    <circle cx="600" cy="96" r="46" fill="url(#footSun)">
      <animate attributeName="cy" values="96;108;96" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <path d="M0,110 Q200,90 400,108 T800,104 T1200,112 V150 H0 Z" fill="#7A4A2E" opacity="0.85"/>
  <path d="M0,126 Q250,108 500,124 T1000,120 T1200,128 V150 H0 Z" fill="#5C3620"/>

  <text x="600" y="45" text-anchor="middle" class="display" font-size="22" font-weight="800" fill="#8A3B00">
    Thanks for stopping by! ✨
  </text>
  <text x="600" y="70" text-anchor="middle" class="body" font-size="14" fill="#7A4A2E" opacity="0.9">
    Always up for a chat about ML, projects, or good anime
  </text>
</svg>
