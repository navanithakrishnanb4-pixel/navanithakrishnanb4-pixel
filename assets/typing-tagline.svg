<svg width="700" height="50" viewBox="0 0 700 50" xmlns="http://www.w3.org/2000/svg">
  <text x="0" y="32" font-family="Courier New, monospace" font-size="24" font-weight="700" fill="#D8481F">&gt;_</text>

  <g font-family="Courier New, monospace" font-size="24" font-weight="700" fill="#18130F">
    <text x="42" y="32" opacity="1">AI / ML Engineer
      <animate attributeName="opacity" values="1;1;0" keyTimes="0;0.18;0.2" dur="10s" begin="0s" repeatCount="indefinite"/>
    </text>
    <text x="42" y="32" opacity="0">Full-Stack Builder
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.25;0.38;0.4" dur="10s" begin="0s" repeatCount="indefinite"/>
    </text>
    <text x="42" y="32" opacity="0">Dragon Ball Enthusiast
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.45;0.58;0.6" dur="10s" begin="0s" repeatCount="indefinite"/>
    </text>
    <text x="42" y="32" opacity="0">Building Nexonic Anime
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.65;0.78;0.8" dur="10s" begin="0s" repeatCount="indefinite"/>
