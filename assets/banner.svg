<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Nunito:wght@500;700&amp;display=swap');
      .display { font-family: 'Baloo 2', cursive; }
      .body { font-family: 'Nunito', sans-serif; }
    </style>

    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5EC8F8"/>
      <stop offset="45%" stop-color="#8FD9F5"/>
      <stop offset="72%" stop-color="#FFC98B"/>
      <stop offset="100%" stop-color="#FF8FA3"/>
    </linearGradient>

    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE29A" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFE29A" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="ballShade" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFC15E"/>
      <stop offset="55%" stop-color="#FF9A3C"/>
      <stop offset="100%" stop-color="#F5750E"/>
    </radialGradient>

    <clipPath id="revealTitle">
      <rect x="0" y="0" width="0" height="90">
        <animate attributeName="width" from="0" to="620" dur="1.3s" begin="0.2s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.1 1"/>
      </rect>
    </clipPath>
    <clipPath id="revealSub">
      <rect x="0" y="0" width="0" height="46">
        <animate attributeName="width" from="0" to="560" dur="1.1s" begin="1.4s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.1 1"/>
      </rect>
    </clipPath>
  </defs>

  <!-- sky -->
  <rect width="1200" height="320" fill="url(#sky)"/>
  <circle cx="1000" cy="70" r="130" fill="url(#sunGlow)"/>

  <!-- clouds, drifting -->
  <g fill="#ffffff" opacity="0.9">
    <g transform="translate(-40,60)">
      <ellipse cx="0" cy="0" rx="46" ry="22"/>
      <ellipse cx="40" cy="-10" rx="34" ry="24"/>
      <ellipse cx="76" cy="4" rx="40" ry="20"/>
      <animateTransform attributeName="transform" type="translate" from="-60 60" to="1260 60" dur="26s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(-40,150)" opacity="0.8">
      <ellipse cx="0" cy="0" rx="36" ry="16"/>
      <ellipse cx="32" cy="-8" rx="26" ry="18"/>
      <ellipse cx="58" cy="2" rx="30" ry="15"/>
      <animateTransform attributeName="transform" type="translate" from="-60 150" to="1280 150" dur="34s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(-40,230)" opacity="0.55">
      <ellipse cx="0" cy="0" rx="30" ry="13"/>
      <ellipse cx="26" cy="-6" rx="20" ry="14"/>
      <animateTransform attributeName="transform" type="translate" from="-60 230" to="1300 230" dur="20s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- bouncing four-star dragon ball -->
  <g transform="translate(1030,150)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-22; 0,0" keyTimes="0;0.5;1" dur="1.6s" repeatCount="indefinite" calcMode="spline" keySplines="0.35 0 0.65 1; 0.35 0 0.65 1"/>
      <circle r="46" fill="url(#ballShade)" stroke="#C9560B" stroke-width="2"/>
      <ellipse cx="-14" cy="-16" rx="14" ry="9" fill="#FFE9C4" opacity="0.8"/>
      <g fill="#C9350B">
        <circle cx="-9" cy="-6" r="3.4"/>
        <circle cx="9" cy="-6" r="3.4"/>
        <circle cx="0" cy="8" r="3.4"/>
        <circle cx="0" cy="-2" r="3.4"/>
      </g>
    </g>
    <ellipse cx="0" cy="52" rx="30" ry="7" fill="#2b2b2b" opacity="0.18">
      <animate attributeName="rx" values="30;22;30" dur="1.6s" repeatCount="indefinite" calcMode="spline" keySplines="0.35 0 0.65 1; 0.35 0 0.65 1"/>
    </ellipse>
  </g>

  <!-- title -->
  <g clip-path="url(#revealTitle)">
    <text x="46" y="150" class="display" font-size="60" font-weight="800" fill="#8A3B00">Navanitha Krishnan B</text>
  </g>
  <g clip-path="url(#revealSub)">
    <text x="46" y="192" class="display" font-size="24" font-weight="700" fill="#FF6F3C">AI / ML Engineer &#8226; Final-Year Student</text>
  </g>

  <!-- friendly caption -->
  <text x="48" y="232" class="body" font-size="16" fill="#7A4A2E" opacity="0">
    Building things that learn, one project at a time
    <animate attributeName="opacity" from="0" to="1" begin="2.4s" dur="0.8s" fill="freeze"/>
  </text>

  <!-- ground line -->
  <path d="M0,300 Q300,285 600,300 T1200,300 V320 H0 Z" fill="#FFEFD6" opacity="0.85"/>
</svg>
